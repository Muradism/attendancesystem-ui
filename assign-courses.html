<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Courses</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
    <div class="header-titles">
        <div class="uni-title">Maltepe Üniversitesi</div>
        <div class="app-title">Automated Attendance System</div>
    </div>
    <nav class="menu">
        <a href="index.html" class="menu-btn">Dashboard</a>
        <a href="start-session.html" class="menu-btn">Start Session</a>
        <a href="students.html" class="menu-btn">Students</a>
        <a href="teachers.html" class="menu-btn">Teachers</a>
        <a href="courses.html" class="menu-btn">Courses</a>
        <a href="assign-courses.html" class="menu-btn">Assign Courses</a>
        <a href="reports.html" class="menu-btn">Reports</a>
    </nav>
</header>

<main class="main">
    <div class="card">

        <h1>Assign Courses to Students</h1>

        <label for="assign-student">Student</label>
        <select id="assign-student" class="input"></select>

        <label for="assign-course">Course</label>
        <select id="assign-course" class="input"></select>

        <label for="assign-semester">Semester</label>
        <input id="assign-semester" class="input" placeholder="Fall 2025">

        <button id="assign-course-btn" class="primary-btn">
            Assign Course
        </button>

        <h2>Enrollments</h2>

        <table class="students-table">
            <thead>
                <tr>
                    <th>Student</th>
                    <th>Course</th>
                    <th>Semester</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="assignments-table-body"></tbody>
        </table>

    </div>
</main>

<script src="database.js"></script>
<script src="script.js"></script>

</body>
</html>
